[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-rag"
version = "0.1.0"
description = "Hybrid RAG over scientific literature in materials science"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.7.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pypdf>=4.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.6", "torch>=2.1"]
llm = ["anthropic>=0.40", "openai>=1.30"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
